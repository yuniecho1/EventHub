<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/navbar.css}" />
</head>
<body>
    <!-- Include Navbar -->
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <div class="form-container">
        <div class="user-details-card">
            
            <div class="user-header">
                <h2 th:if="${detailedUser}" th:text="${detailedUser.userName}">User Name</h2>
            </div>

            <!-- Error / Success Messages -->
            <div th:if="${error}" class="error-message">
                <p th:text="${error}"></p>
            </div>
            <div th:if="${success}" class="success-message">
                <p th:text="${success}"></p>
            </div>

            <!-- User Info -->
            <div th:if="${detailedUser}" class="user-content">
                <div class="user-info-grid">
                    <div class="info-item">
                        <label>Email:</label>
                        <span th:text="${detailedUser.userEmail}">example@email.com</span>
                    </div>
                    <div class="info-item">
                        <label>Role:</label>
                        <span th:text="${detailedUser.userType}">User Type</span>
                    </div>
                    <div class="info-item">
                        <label>Name:</label>
                        <span th:text="${detailedUser.userName}">First</span>
                    </div>
                    <div class="info-item">
                        <label>Joined:</label>
                        <span th:text="${#temporals.format(detailedUser.userJoinDate, 'dd MMM yyyy')}">01 Jan 2025</span>
                    </div>
                    <div class="info-item">
                        <label>Status:</label>
                        <span th:text="${detailedUser.userDeactivationStatus ? 'Deactivated' : 'Active'}">Active</span>
                    </div>
                </div>

                <div class="button-container flex-buttons">
                    <div th:if="${showDelete}">
                        <a th:href="@{'/user/delete?email=' + ${detailedUser.userEmail}}" class="delete-button">Delete</a>
                        <a th:href="@{'/user/ban?email=' + ${detailedUser.userEmail}}"
                            th:class="${detailedUser.userDeactivationStatus ? 'unban-button' : 'ban-button'}"
                            th:text="${detailedUser.userDeactivationStatus ? 'Unban' : 'Ban'}"></a>
                    </div>

                    <div th:if="${showDelete}" class="info-item" style="margin-top: 10px;">
                        <label for="userTypeSelect">Change Role:</label>
                        <form th:action="@{/user/updateRole}" method="post" class ='update-role-form'>
                            <input type="hidden" name="email" th:value="${detailedUser.userEmail}" />
                            <select id="userTypeSelect" name="userType">
                                <option th:value="Student" th:selected="${detailedUser.userType == 'Student'}">Student</option>
                                <option th:value="Club_Organiser" th:selected="${detailedUser.userType == 'Club_Organiser'}">Club Organiser</option>
                                <option th:value="Administrator" th:selected="${detailedUser.userType == 'Administrator'}">Admin</option>
                            </select>
                            <button type="submit">Update</button>
                        </form>
                    </div>
                </div>


            </div>

            <!-- No user found -->
            <div th:unless="${detailedUser}" class="no-user-message">
                <p>User not found.</p>
            </div>

            <!-- Back button -->
            <div class="button-container">
                <a href="/user/all" class="back-button">← Back to Users</a>
            </div>

        </div>
    </div>

    <script th:src="@{/js/submitForm.js}"></script>
    <script>
        attachForms([
            { formId: 'userDetailsForm', successUrl: '/user/all', fallbackUrl: '/dashboard' }
        ]);
    </script>

</body>
</html>
