<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirm Delete User</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/navbar.css}" />
</head>
<body>
    <!-- Include Navbar -->
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <div class="form-container">
        <div class="user-details-card">
            <div class="user-header">
                <h2 th:text="${detailedUser.userName}">User Name</h2>
            </div>
            
            <h1 style="color: #dc3545; text-align: center; margin-bottom: 20px;">Confirm Delete</h1>
           
            <!-- Error Message -->
            <div class="error-message" th:if="${error}">
                <p th:text="${error}"></p>
            </div>
           
            <!-- User Found -->
            <div th:if="${detailedUser}" class="user-content">
                <div class="user-info-grid">
                    <div class="info-item">
                        <label>Email:</label>
                        <span th:text="${detailedUser.userEmail}">user@example.com</span>
                    </div>
                    <div class="info-item">
                        <label>Role:</label>
                        <span th:text="${detailedUser.userType}">User Role</span>
                    </div>
                    <div class="info-item">
                        <label>Name:</label>
                        <span th:text="${detailedUser.userName}">First</span>
                    </div>
                </div>
               
                <!-- Warning Box -->
                <div class="delete-warning" style="background-color: #f8d7da; color: #721c24; padding: 20px; border-radius: 8px; margin: 30px 0; border: 1px solid #f5c6cb; text-align: center;">
                    <p style="margin: 0 0 10px 0; font-size: 1.2em;"><strong>⚠️ Are you sure you want to delete this user?</strong></p>
                    <p style="margin: 0; font-weight: 600;">This action cannot be undone.</p>
                </div>
               
                <!-- Action Buttons -->
                <div class="user-buttons" style="justify-content: center; gap: 20px;">
                    <form method="post" th:action="@{/user/delete}" style="display: inline-block;">
                        <input type="hidden" th:name="email" th:value="${detailedUser.userEmail}" />
                        <button type="submit" class="delete-button">Yes, Delete User</button>
                    </form>
                    <a th:href="@{'/user/details?email=' + ${detailedUser.userEmail}}" class="back-button" style="min-width: 150px; text-align: center;">Cancel</a>
                </div>
            </div>
           
            <!-- User Not Found -->
            <div th:unless="${detailedUser}" class="no-user-message">
                <p>User not found.</p>
                <div class="button-container">
                    <a href="/user/all" class="back-button">← Back to Users</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
